name: 버그 리포트
description: 재현 가능한 문제나 예상과 다른 동작을 보고합니다.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: 기존 이슈 확인
      description: 새로운 이슈를 작성하기 전에 동일하거나 유사한 이슈가 있는지 확인해주세요.
      options:
        - label: 기존 이슈를 확인했습니다.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: 현재 동작
      description: 현재 어떤 문제가 발생하고 있는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 기대 동작
      description: 정상적으로 동작한다면 어떤 결과가 나와야 하는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 절차를 순서대로 작성해주세요.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제가 발생한 환경 정보를 작성해주세요.
      placeholder: |
        - OS:
        - Runtime:
        - Version/Commit:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 로그, 스크린샷, 관련 이슈 등 추가로 도움이 될 정보를 작성해주세요.
    validations:
      required: false