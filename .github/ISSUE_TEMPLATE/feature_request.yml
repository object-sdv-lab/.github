name: 기능 제안
description: 새로운 기능이나 개선 사항을 제안합니다.
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: 기존 이슈 확인
      description: 새로운 이슈를 작성하기 전에 동일하거나 유사한 이슈가 있는지 확인해주세요.
      options:
        - label: 기존 이슈를 확인했습니다.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 문제 또는 필요성
      description: 이 기능이 해결하려는 문제나 필요한 이유를 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: 제안하는 해결 방법
      description: 원하는 기능이나 개선 방향을 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 검토한 다른 방법이나 접근 방식이 있다면 작성해주세요.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 참고 자료, 다이어그램, 관련 이슈 등 추가 정보를 작성해주세요.
    validations:
      required: false