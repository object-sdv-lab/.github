name: "기능 요청"
description: "새로운 기능을 제안하거나 요청합니다."
title: "[Feature] "
labels: ["enhancement"]
type: feature
body:
  - type: textarea
    id: description
    attributes:
      label: 기능 설명
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 요청 이유
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 참고 사항

  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 같은 기능 요청이 이미 등록되어 있는지 확인했습니다.
          required: true
